on:
  push:
    branches:
      - main
  # Publish an existing release tag by hand (e.g. one whose publish failed).
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.5.0)
        required: true

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # npm Trusted Publishing (OIDC): no NPM_TOKEN secret. The package's
  # trusted publisher on npmjs.com must name this repo and this workflow file,
  # with the "npm stage publish" permission.
  publish:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or later; pinned to a major so a
      # new npm cannot change publish behaviour unannounced.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      # Staged publish: the trusted publisher grants `npm stage publish`, so
      # the version waits on npmjs.com until a maintainer approves it with
      # 2FA (`npm stage approve <stage-id>`).
      - run: npm stage publish
