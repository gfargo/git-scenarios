<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Git graph decoration (left side) -->
  <circle cx="120" cy="180" r="12" fill="#22d3ee" opacity="0.8"/>
  <circle cx="120" cy="280" r="12" fill="#a78bfa" opacity="0.8"/>
  <circle cx="120" cy="380" r="12" fill="#34d399" opacity="0.8"/>
  <circle cx="200" cy="330" r="10" fill="#f59e0b" opacity="0.7"/>
  <line x1="120" y1="192" x2="120" y2="268" stroke="#22d3ee" stroke-width="3" opacity="0.5"/>
  <line x1="120" y1="292" x2="120" y2="368" stroke="#a78bfa" stroke-width="3" opacity="0.5"/>
  <line x1="120" y1="280" x2="200" y2="320" stroke="#a78bfa" stroke-width="2.5" opacity="0.4"/>

  <!-- Title -->
  <text x="300" y="260" font-family="monospace" font-size="72" font-weight="bold" fill="#f1f5f9" letter-spacing="-2">git-scenarios</text>

  <!-- Tagline -->
  <text x="300" y="320" font-family="monospace" font-size="24" fill="#94a3b8">Spin up real git repos in any state.</text>
  <text x="300" y="360" font-family="monospace" font-size="24" fill="#94a3b8">Deterministically.</text>

  <!-- Stats bar -->
  <text x="300" y="440" font-family="monospace" font-size="18" fill="#22d3ee">27 scenarios</text>
  <text x="500" y="440" font-family="monospace" font-size="18" fill="#64748b">·</text>
  <text x="530" y="440" font-family="monospace" font-size="18" fill="#a78bfa">50+ atoms</text>
  <text x="700" y="440" font-family="monospace" font-size="18" fill="#64748b">·</text>
  <text x="730" y="440" font-family="monospace" font-size="18" fill="#34d399">TypeScript</text>

  <!-- npm badge -->
  <rect x="300" y="470" width="280" height="36" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="316" y="494" font-family="monospace" font-size="14" fill="#94a3b8">$ npm i @gfargo/git-scenarios</text>

  <!-- Corner accent -->
  <rect x="1140" y="0" width="60" height="4" fill="#22d3ee" opacity="0.8"/>
  <rect x="1196" y="0" width="4" height="60" fill="#22d3ee" opacity="0.8"/>
  <rect x="0" y="626" width="60" height="4" fill="#34d399" opacity="0.8"/>
  <rect x="0" y="570" width="4" height="60" fill="#34d399" opacity="0.8"/>
</svg>
